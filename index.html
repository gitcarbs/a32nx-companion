<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A32NX Flight Deck Companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0e12; --panel:#131a21; --panel2:#0f151b; --line:#243040;
  --grn:#33d97e; --cyn:#3cc8de; --amb:#ffb648; --wht:#e9eef3; --mag:#d78bf0;
  --dim:#7d8ea0; --dimmer:#55657a;
  --mono:'IBM Plex Mono',Consolas,Menlo,monospace;
  --disp:'Barlow Condensed','Arial Narrow',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--wht);font-family:var(--mono);font-size:14px;line-height:1.5;
  background-image:radial-gradient(ellipse 90% 60% at 50% -10%, #16202b 0%, transparent 60%)}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:1240px;margin:0 auto;padding:0 18px 90px}

/* ---------- header ---------- */
header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:26px 0 10px;flex-wrap:wrap}
h1{font-family:var(--disp);font-weight:700;font-size:34px;letter-spacing:.06em;line-height:1;color:var(--wht)}
h1 .neo{color:var(--cyn)}
.sub{color:var(--dim);font-size:12px;letter-spacing:.08em;margin-top:6px}
.hdr-right{display:flex;align-items:center;gap:14px}
.prog-pill{border:1px solid var(--line);border-radius:4px;padding:7px 12px;font-size:12px;color:var(--dim);background:var(--panel2)}
.prog-pill b{color:var(--grn);font-weight:600}
.conn{border:1px solid var(--line);border-radius:4px;padding:7px 12px;font-size:11.5px;letter-spacing:.08em;color:var(--dimmer);background:var(--panel2);display:flex;gap:12px}
.conn[hidden]{display:none}
.conn span::after{content:" ●"}
.conn .on{color:var(--grn)}
.reset{background:none;border:1px solid var(--line);color:var(--dim);border-radius:4px;padding:7px 12px;font-size:12px;letter-spacing:.05em}
.reset:hover{border-color:var(--amb);color:var(--amb)}

/* ---------- flight profile nav ---------- */
.profile{margin:14px 0 20px;border:1px solid var(--line);border-radius:6px;background:var(--panel2);padding:14px 10px 6px;overflow-x:auto}
.profile svg{display:block;min-width:940px;width:100%;height:150px}
.pf-path{fill:none;stroke:#2b3a4c;stroke-width:2;stroke-dasharray:5 5}
.pf-path-done{fill:none;stroke:var(--grn);stroke-width:2.5}
.pf-node{cursor:pointer}
.pf-node circle{fill:var(--panel);stroke:var(--cyn);stroke-width:2;transition:all .15s}
.pf-node.done circle{fill:#0f2a1c;stroke:var(--grn)}
.pf-node.active circle{stroke:var(--wht);stroke-width:3;r:9}
.pf-node text{fill:var(--dim);font-family:var(--disp);font-size:12.5px;letter-spacing:.05em;text-anchor:middle}
.pf-node.active text{fill:var(--wht)}
.pf-node.done text{fill:var(--grn)}
.pf-node:hover circle{stroke:var(--wht)}
.pf-ground{stroke:#31414f;stroke-width:1}

/* ---------- layout ---------- */
.grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
@media(max-width:960px){.grid{grid-template-columns:1fr}}

/* ---------- phase card ---------- */
.phase-head{display:flex;align-items:baseline;gap:14px;margin-bottom:12px;flex-wrap:wrap}
.phase-num{font-family:var(--disp);font-size:15px;color:var(--dimmer);letter-spacing:.1em}
.phase-title{font-family:var(--disp);font-weight:700;font-size:28px;letter-spacing:.05em}
.phase-goal{color:var(--dim);font-size:13px;margin-bottom:14px;max-width:70ch}

/* BATC comms card */
.batc{border:1px solid #2a4652;border-left:3px solid var(--cyn);background:linear-gradient(180deg,#10202a,#0e1922);border-radius:5px;padding:13px 15px;margin-bottom:14px}
.batc-tag{font-family:var(--disp);font-size:13px;letter-spacing:.14em;color:var(--cyn);margin-bottom:7px}
.batc ul{list-style:none}
.batc li{padding:3px 0 3px 18px;position:relative;color:#cfe2ea;font-size:13px}
.batc li::before{content:"▸";position:absolute;left:0;color:var(--cyn)}
.batc .say{color:var(--wht);background:#132b36;border-radius:3px;padding:0 5px}

/* tabs */
.tabs{display:flex;gap:6px;margin-bottom:0}
.tab{font-family:var(--disp);font-size:15px;letter-spacing:.1em;padding:9px 20px;border:1px solid var(--line);border-bottom:none;
  border-radius:5px 5px 0 0;background:var(--panel2);color:var(--dim)}
.tab.on{background:var(--panel);color:var(--wht);border-color:#31414f}
.tab:disabled{opacity:.35;cursor:default}
.pane{border:1px solid #31414f;border-radius:0 5px 5px 5px;background:var(--panel);padding:16px 16px 10px;min-height:120px}

/* flows */
.flow-sec{margin-bottom:16px}
.flow-sec h3{font-family:var(--disp);font-size:15px;letter-spacing:.12em;color:var(--amb);margin-bottom:8px;border-bottom:1px solid var(--line);padding-bottom:4px}
.step{display:flex;gap:10px;align-items:flex-start;padding:5px 6px;border-radius:4px}
.step:hover{background:#182129}
.step input{margin-top:4px;accent-color:var(--grn);width:15px;height:15px;flex:none}
.step .txt{flex:1;color:#d6dde4}
.step.ck .txt{color:var(--grn)}
.step .txt b{color:var(--wht);font-weight:600}
.step.ck .txt b{color:var(--grn)}
.chip{display:inline-block;font-size:10.5px;letter-spacing:.06em;color:var(--dim);border:1px solid var(--line);border-radius:3px;padding:0 6px;margin-left:8px;vertical-align:1px;white-space:nowrap}
.note{color:var(--dim);font-size:12.5px;display:block;margin-top:2px}

/* checklist — ECAM style */
.cl-title{font-family:var(--disp);font-size:16px;letter-spacing:.14em;color:var(--wht);text-align:center;margin:4px 0 10px}
.cl-title span{border-bottom:1px solid var(--wht);padding:0 30px 2px}
.cl-item{display:flex;align-items:baseline;gap:8px;padding:4px 6px;border-radius:3px;cursor:pointer;user-select:none}
.cl-item:hover{background:#182129}
.cl-ch{color:var(--cyn);white-space:nowrap}
.cl-dots{flex:1;border-bottom:1px dotted #3b4c5e;transform:translateY(-4px)}
.cl-rsp{color:var(--cyn);white-space:nowrap;text-align:right}
.cl-item.ck .cl-ch,.cl-item.ck .cl-rsp{color:var(--grn)}
.cl-item.ck .cl-ch::before{content:"✓ "}
.cl-line{border-top:1px solid var(--dimmer);margin:10px 40px;position:relative}
.cl-line::after{content:"BELOW THE LINE";position:absolute;top:-8px;left:50%;transform:translateX(-50%);background:var(--panel);padding:0 10px;font-size:10px;letter-spacing:.15em;color:var(--dimmer)}
.cl-none{color:var(--dim);font-size:13px;padding:8px 4px}

/* example rail */
.rail{border:1px solid #3a3423;border-left:3px solid var(--amb);background:linear-gradient(180deg,#191712,#14120d);border-radius:5px;padding:14px 15px;position:sticky;top:14px}
.rail-tag{font-family:var(--disp);font-size:13px;letter-spacing:.14em;color:var(--amb);margin-bottom:2px}
.rail-route{font-family:var(--disp);font-size:21px;letter-spacing:.06em;color:var(--wht);margin-bottom:9px}
.rail table{width:100%;border-collapse:collapse;font-size:12.5px}
.rail td{padding:3.5px 0;vertical-align:top}
.rail td:first-child{color:var(--dim);padding-right:10px;white-space:nowrap}
.rail td:last-child{color:var(--amb);text-align:right;font-weight:500}
.rail .rl-note{color:var(--dim);font-size:11.5px;margin-top:9px;border-top:1px solid #33301f;padding-top:8px}
.rail-refresh{margin-top:10px;width:100%;background:none;border:1px solid #3a3423;color:var(--amb);border-radius:4px;padding:6px 0;font-size:11.5px;letter-spacing:.08em}
.rail-refresh:hover{border-color:var(--amb)}

/* footer nav */
.pager{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(180deg,transparent,#0b0e12 30%);padding:22px 18px 16px;pointer-events:none}
.pager-in{max-width:1240px;margin:0 auto;display:flex;justify-content:space-between;gap:10px}
.pager button{pointer-events:auto;font-family:var(--disp);font-size:15px;letter-spacing:.1em;border:1px solid #31414f;background:var(--panel);color:var(--wht);border-radius:5px;padding:10px 22px}
.pager button:hover:not(:disabled){border-color:var(--cyn);color:var(--cyn)}
.pager button:disabled{opacity:.25;cursor:default}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>A32<span class="neo">NX</span> FLIGHT DECK COMPANION</h1>
      <div class="sub">SIMBRIEF → SECURING · FLYBYWIRE A32NX · MSFS 2024 · BEYONDATC COMMS</div>
    </div>
    <div class="hdr-right">
      <div class="conn" id="connPill" hidden></div>
      <div class="prog-pill">FLIGHT PROGRESS <b id="progPct">0%</b></div>
      <button class="reset" id="resetBtn">RESET FLIGHT</button>
    </div>
  </header>
  <div class="profile"><svg id="profileSvg" viewBox="0 0 940 150" preserveAspectRatio="xMidYMid meet"></svg></div>
  <div class="grid">
    <article id="phaseArt"></article>
    <aside id="railBox"></aside>
  </div>
</div>
<div class="pager"><div class="pager-in">
  <button id="prevBtn">◀ PREV PHASE</button>
  <button id="nextBtn">NEXT PHASE ▶</button>
</div></div>
<script>
const GY=118;
const D=[
/* ============ 0 PLAN ============ */
{id:"plan",nav:"PLAN",y:GY,title:"FLIGHT PLANNING — SIMBRIEF",goal:"Build the OFP that everything downstream feeds off: the MCDU uplink, flyPad fuel & payload, the performance calculator, and BeyondATC's filed flight plan.",
batc:["BeyondATC pulls your <b>latest generated SimBrief OFP</b> automatically — generate the plan first, then open BATC and confirm the flight appears before loading the sim.","In BATC, pick the flight and spawn your session at the departure airport. Traffic and controllers build around your filed route and EOBT."],
flows:[
 {h:"DISPATCH SETUP",k:"setup",s:[
  {id:"airframe",t:"<b>Airframe</b> — select the FlyByWire A32NX profile (import FBW's official SimBrief airframe if you haven't; it carries correct OEW, MZFW/MTOW and fuel figures)",c:"SIMBRIEF"},
  {id:"airports",t:"<b>Origin / Destination / ALTN</b> — enter ICAOs; let SimBrief suggest an alternate or pick one you know",c:"SIMBRIEF"},
  {id:"route",t:"<b>Route</b> — click a recent real-world route from the route finder rather than DCT; it'll have flyable SIDs/STARs",c:"SIMBRIEF"},
  {id:"ci",t:"<b>Cost Index</b> — 15–25 is a sane default for the neo on short/medium haul",c:"SIMBRIEF"},
  {id:"units",t:"<b>Units</b> — KGS to match A32NX cockpit defaults; saves you a conversion later",c:"SIMBRIEF"},
  {id:"generate",t:"<b>Generate OFP</b>",c:"SIMBRIEF"}]},
 {h:"READ THE OFP (THE NUMBERS YOU'LL RE-ENTER LATER)",k:"ofp",s:[
  {id:"block",t:"<b>BLOCK FUEL</b> — goes into flyPad fuel page and MCDU INIT B",c:"OFP"},
  {id:"zfw",t:"<b>ZFW / ZFWCG</b> — goes into MCDU INIT B (flyPad W&B shows the same after boarding)",c:"OFP"},
  {id:"crz",t:"<b>CRZ FL and step climbs</b> — INIT A cruise level; note any step (e.g. FL320 → FL360)",c:"OFP"},
  {id:"rwy",t:"<b>Planned runway + SID/STAR</b> — advisory only; BeyondATC's ATIS and clearance are authoritative in-sim",c:"OFP"},
  {id:"fuel",t:"<b>TRIP / CONT / FINAL RES fuel breakdown</b> — your in-cruise fuel checks compare against these",c:"OFP"},
  {id:"flypad_link",t:"<b>SimBrief userID linked in flyPad</b> — EFB Settings → 3rd party → SimBrief, so OFP auto-imports at the gate",c:"EFB",n:"One-time setup, but the single most common 'why is my uplink empty' cause."}]}],
cl:null,
rail:{rows:[["Route","KRDU → KATL"],["Airframe","A20N (FBW)"],["Dist / time","356 nm · 1h04"],["CI","15"],["CRZ","FL320"],["ALTN","KBHM"],["Block fuel","5 400 kg"],["Trip fuel","2 650 kg"],["ZFW","55 300 kg"],["TOW","60 500 kg"]],note:"Example numbers are illustrative for a lightly-loaded neo on this sector — always fly your own OFP's figures."}},

/* ============ 1 COLD & DARK ============ */
{id:"dark",nav:"COLD & DARK",y:GY,title:"COLD & DARK → AIRCRAFT POWERED",goal:"Bring the aircraft from a dead battery bus to a powered, aligning state. Order matters: batteries, external power or APU, then ADIRS immediately — alignment is your longest timer (~10 min).",
batc:["Nothing to say on the radio yet. If you want ambience, tune the ATIS once avionics are up — BATC's ATIS is what assigns your runway later."],
flows:[
 {h:"ELECTRICAL POWER-UP",k:"elec",s:[
  {id:"bat",t:"<b>BAT 1 + BAT 2</b> — ON",c:"OVHD ELEC"},
  {id:"ext_pwr",t:"<b>EXT PWR</b> — ON when AVAIL is lit",c:"OVHD ELEC",n:"No ground cart? flyPad → Ground Services → connect external power. Otherwise skip to APU."},
  {id:"apu",t:"<b>APU (if no ext pwr)</b> — MASTER SW ON, wait for ECAM APU flap, then START",c:"OVHD APU",n:"On ext pwr, delay APU start until ~5 min before pushback — saves fuel, matches real ops."}]},
 {h:"IMMEDIATELY AFTER POWER",k:"power",s:[
  {id:"adirs",t:"<b>ADIRS 1, 2, 3</b> — NAV",c:"OVHD ADIRS",n:"Start the ~10 min alignment now and do everything else while it runs. IR lights extinguish when aligned."},
  {id:"lights",t:"<b>Cockpit / integ / dome lights</b> — as required",c:"OVHD"}]},
 {h:"SAFETY TESTS & OVERHEAD SCAN",k:"tests",s:[
  {id:"eng1_fire",t:"<b>ENG 1 FIRE test</b> — press & hold, verify aural + master warn + ENG FIRE lights",c:"OVHD FIRE"},
  {id:"eng2_fire",t:"<b>ENG 2 FIRE test</b> — same",c:"OVHD FIRE"},
  {id:"apu_fire",t:"<b>APU FIRE test</b> — same",c:"OVHD FIRE"},
  {id:"emer_exit",t:"<b>EMER EXIT LT</b> — ARM",c:"OVHD"},
  {id:"seat_belts",t:"<b>SEAT BELTS</b> — ON",c:"OVHD"},
  {id:"no_smoking",t:"<b>NO PED / NO SMOKING</b> — AUTO",c:"OVHD"},
  {id:"probe_heat",t:"<b>PROBE/WINDOW HEAT</b> — AUTO (dark)",c:"OVHD"},
  {id:"ovhd_scan",t:"<b>Overhead scan</b> — all white lights out top-to-bottom, guarded switches guarded",c:"OVHD",n:"The A320 dark-cockpit philosophy: a clean overhead is an overhead with no white lights."}]}],
cl:{title:"NO DEDICATED CHECKLIST",none:"This work is verified later as the single line 'COCKPIT PREP — COMPLETED' on the BEFORE START checklist. Flows do the work; checklists confirm it."},
rail:{rows:[["Power source","EXT PWR (gate 74)"],["ADIRS start","T-45 min"],["Align time","~10 min"],["APU start","T-8 min (before push)"]],note:"On this sector you have time to spare — a 1h04 flight still wants the full 30–40 min turnaround rhythm if you're doing it properly."}},

/* ============ 2 PREP ============ */
{id:"prep",nav:"MCDU PREP",y:GY,title:"COCKPIT PREP — FMGC & PERFORMANCE",goal:"Program the box, load the jet. INIT A → F-PLN → INIT B → PERF, in that order, because fuel predictions need the route and performance needs the weights.",
batc:["Tune and copy the <b>ATIS</b> now (frequency on the chart, or BATC's UI). Note the letter, QNH and runway in use — your PERF TO calc must match the BATC-assigned runway, not SimBrief's guess."],
flows:[
 {h:"MCDU — DATA & INIT A",k:"init",s:[
  {id:"status",t:"<b>DATA → STATUS</b> — AIRAC cycle matches your SimBrief cycle",c:"MCDU",n:"Mismatched cycles = waypoints that won't resolve on uplink."},
  {id:"init_request",t:"<b>INIT A → INIT REQUEST*</b> — uplinks the SimBrief plan: FROM/TO, route, ALTN, FLT NBR",c:"MCDU"},
  {id:"ci",t:"<b>CI</b> — confirm uplinked value",c:"MCDU"},
  {id:"crz_fl",t:"<b>CRZ FL / TEMP</b> — confirm (e.g. FL320)",c:"MCDU"},
  {id:"flt_nbr",t:"<b>FLT NBR</b> — set if blank",c:"MCDU"}]},
 {h:"MCDU — F-PLN & RAD NAV",k:"fpln",s:[
  {id:"legs",t:"<b>F-PLN page</b> — step through legs against the OFP line by line",c:"MCDU"},
  {id:"discont",t:"<b>Discontinuities</b> — clear any that shouldn't be there (CLR key onto the discont)",c:"MCDU"},
  {id:"sid",t:"<b>SID</b> — leave unset or set the ATIS-likely one; be ready to swap after BATC clearance",c:"MCDU"},
  {id:"radnav",t:"<b>RAD NAV</b> — verify autotuned; note departure-return ILS ident",c:"MCDU"}]},
 {h:"FLYPAD — LOAD THE AIRCRAFT",k:"load",s:[
  {id:"fuel",t:"<b>flyPad → Fuel</b> — set block fuel from OFP, refuel",c:"EFB"},
  {id:"payload",t:"<b>flyPad → Payload</b> — board pax + cargo to OFP figures",c:"EFB",n:"Instant vs real-time loading is a flyPad setting; real-time paces nicely with the rest of prep."},
  {id:"doors",t:"<b>Doors</b> — leave open until boarding complete",c:"EFB"}]},
 {h:"MCDU — INIT B & PERF TO",k:"perf",s:[
  {id:"zfw",t:"<b>INIT B → ZFW / ZFWCG</b> — from flyPad W&B page after boarding",c:"MCDU"},
  {id:"block",t:"<b>BLOCK</b> — enter block fuel; predictions populate",c:"MCDU"},
  {id:"perf_calc",t:"<b>flyPad → Performance</b> — compute takeoff perf for the ATIS runway: CONF, FLEX, V-speeds",c:"EFB"},
  {id:"flaps_ths",t:"<b>PERF TO → FLAPS/THS</b> — e.g. 1/UP0.0",c:"MCDU"},
  {id:"flex",t:"<b>PERF TO → FLEX TEMP</b> — from calculator",c:"MCDU"},
  {id:"vspeeds",t:"<b>PERF TO → V1 · VR · V2</b> — insert all three",c:"MCDU"},
  {id:"thr_red",t:"<b>THR RED / ACC + TRANS ALT</b> — verify (US: trans alt 18 000)",c:"MCDU"}]},
 {h:"FCU & LOWER PANEL",k:"fcu",s:[
  {id:"baro",t:"<b>Baro ref</b> — set ATIS QNH both sides + ISIS",c:"FCU/ISIS"},
  {id:"nd",t:"<b>ND mode/range</b> — ARC 10–20 nm for departure",c:"FCU"},
  {id:"fd",t:"<b>FD</b> — ON both sides, <b>LS</b> off unless departure return briefed",c:"FCU"}]}],
cl:null,
rail:{rows:[["ATIS","INFO C · RWY 23L"],["QNH","30.12 inHg"],["CI","15"],["CRZ","FL320"],["ZFW / ZFWCG","55 300 kg / 27.1%"],["BLOCK","5 400 kg"],["CONF / THS","1+F / UP0.0"],["FLEX","62°C"],["V1 · VR · V2","133 · 135 · 138"]],note:"V-speeds and FLEX shown for ~60.5 t TOW, CONF 1+F, dry 10 000 ft runway. Recompute in flyPad for your actual runway and weight."}},

/* ============ 3 CLEARANCE ============ */
{id:"clr",nav:"CLEARANCE",y:GY,title:"IFR CLEARANCE — BEYONDATC",goal:"Get the clearance, then make the aircraft agree with it: SID into the F-PLN, initial altitude on the FCU, squawk in the box.",
batc:["Contact <b>Clearance Delivery</b> ~10 min before push (BATC menu → request IFR clearance).","Expect the CRAFT items: <span class='say'>cleared to KATL via the LILLS4 departure, then as filed · climb 5 000, expect FL320 in 10 · departure 125.35 · squawk 2244</span>.","Read back — or let BATC <b>auto-respond</b> handle readbacks if you prefer flying to talking. Your call, it's a setting.","BATC amendments are normal: different SID or initial altitude than SimBrief planned. The clearance wins."],
flows:[
 {h:"MAKE THE JET MATCH THE CLEARANCE",k:"match",s:[
  {id:"sid",t:"<b>F-PLN → LAT REV at origin</b> — insert the cleared SID + transition",c:"MCDU"},
  {id:"discont",t:"<b>Check for new discontinuities</b> after SID insertion",c:"MCDU"},
  {id:"fcu_alt",t:"<b>FCU ALT</b> — set initial climb altitude (e.g. 5 000)",c:"FCU"},
  {id:"xpdr_code",t:"<b>XPDR code</b> — set squawk, leave STBY for now",c:"PED"},
  {id:"perf_to",t:"<b>PERF TO</b> — re-verify if the runway changed from your calc",c:"MCDU",n:"Runway change = full flyPad perf recompute. Don't fly old numbers."},
  {id:"brief",t:"<b>Departure brief</b> — SID routing, initial alt, engine-out plan, return runway/ILS",c:"BRIEF"}]}],
cl:{title:"BEFORE START C/L — ABOVE THE LINE",items:[
 {id:"cockpit_prep",ch:"COCKPIT PREP",rsp:"COMPLETED (BOTH)"},{id:"gear_pins",ch:"GEAR PINS & COVERS",rsp:"REMOVED"},{id:"signs",ch:"SIGNS",rsp:"ON / AUTO"},{id:"adirs",ch:"ADIRS",rsp:"NAV"},{id:"fuel_qty",ch:"FUEL QUANTITY",rsp:"___ KG"},{id:"to_data",ch:"TO DATA",rsp:"SET"},{id:"baro",ch:"BARO REF",rsp:"___ SET (BOTH)"}]},
rail:{rows:[["Cleared via","LILLS4, as filed"],["Initial climb","5 000 ft"],["Expect","FL320 in 10"],["Departure freq","125.35"],["Squawk","2244"],["FCU ALT set","5000"]],note:"Illustrative clearance. The pattern (SID · initial alt · expect · freq · squawk) is what BATC will always give you — copy it in that order."}},
/* ============ 4 PUSH & START ============ */
{id:"push",nav:"PUSH & START",y:GY,title:"PUSHBACK & ENGINE START",goal:"Close up, transfer to APU power, push, and start 2 then 1. The A320 starts are fully automatic — your job is monitoring, not managing.",
batc:["Contact <b>Ground</b>: <span class='say'>request pushback and engine start</span>. BATC clears you with a facing direction — comply, other traffic is real.","The push itself is yours: flyPad pushback tug page (or GSX if you run it). BATC controls the clearance, not the tug.","When start is complete and you're ready: <span class='say'>request taxi</span> — next phase."],
flows:[
 {h:"BEFORE PUSHBACK",k:"before",s:[
  {id:"apu",t:"<b>APU</b> — MASTER ON → START (if not already running)",c:"OVHD APU"},
  {id:"apu_bleed_on",t:"<b>APU BLEED</b> — ON",c:"OVHD AIR"},
  {id:"ext_pwr",t:"<b>EXT PWR</b> — OFF, then disconnect via flyPad ground services",c:"OVHD ELEC"},
  {id:"doors",t:"<b>flyPad → Doors</b> — all closed, jetway/stairs disconnected",c:"EFB"},
  {id:"fuel_pumps",t:"<b>FUEL PUMPS</b> — all six ON",c:"OVHD FUEL"},

/* Progress, cue links and rules all address steps by these IDs, so a
   duplicate would silently merge two steps. */
const STEP_IDS=new Set();
function claim(st,key){
  if(STEP_IDS.has(key))console.error("Duplicate step id",key);
  STEP_IDS.add(key);st.key=key;
}
D.forEach(p=>{
  (p.flows||[]).forEach(sec=>sec.s.forEach(st=>claim(st,`${p.id}.${sec.k}.${st.id}`)));
  if(p.cl&&p.cl.items)p.cl.items.forEach(it=>{if(!it.line)claim(it,`${p.id}.cl.${it.id}`)});
});
const state={checks:new Set(),cur:0,tab:"flow",ofp:null,bridge:{connected:false,sources:{sim:false,mcdu:false,ofp:false}}};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const SKEY="a32nx-companion.v2";
try{localStorage.removeItem("a32nx-companion.v1")}catch(e){}

/* Storage can throw in private mode or with cookies blocked — a broken save
   must never take the page down with it. */
function save(){
  try{localStorage.setItem(SKEY,JSON.stringify({checks:[...state.checks],cur:state.cur,tab:state.tab}))}
  catch(e){/* progress stays in-memory for this session */}
}
function load(){
  let raw;
  try{raw=localStorage.getItem(SKEY)}catch(e){return}
  if(!raw)return;
  try{
    const s=JSON.parse(raw);
    if(Array.isArray(s.checks))state.checks=new Set(s.checks.filter(k=>STEP_IDS.has(k)));
    if(Number.isInteger(s.cur)&&s.cur>=0&&s.cur<D.length)state.cur=s.cur;
    if(s.tab==="cl"&&D[state.cur].cl)state.tab="cl";
  }catch(e){/* corrupt payload — start a fresh flight */}
}

function phaseItems(p){
  const flow=(p.flows||[]).flatMap(sec=>sec.s);
  const cl=p.cl&&p.cl.items?p.cl.items.filter(it=>!it.line):[];
  return flow.concat(cl);
}
function phaseTotals(pi){
  const items=phaseItems(D[pi]);
  return[items.filter(it=>state.checks.has(it.key)).length,items.length];
}
const wt=(v,o)=>Math.round(v).toLocaleString("en-US").replace(/,/g," ")+" "+o.units;
const fl=n=>"FL"+String(n).padStart(3,"0");
function ofpRows(pid,o){
  const destFob=o.fixes.length?wt(o.fixes[o.fixes.length-1].planned_fob,o):"—";
  const steps=o.step_climbs.length?o.step_climbs.map(([f,l])=>`${f} ${fl(l)}`).join(" · "):"none";
  const r={
    route:["Route",`${o.origin} → ${o.dest}`],altn:["ALTN",o.altn||"—"],ci:["CI",o.cost_index],
    crz:["CRZ",fl(o.initial_fl)],steps:["Step climbs",steps],block:["Block fuel",wt(o.block_fuel,o)],
    trip:["Trip fuel",wt(o.trip_fuel,o)],fres:["Final reserve",wt(o.final_reserve,o)],
    zfw:["ZFW",wt(o.zfw,o)],tow:["TOW",wt(o.tow,o)],ldw:["LDW",wt(o.ldw,o)],
    deprwy:["Dep RWY",o.origin_rwy||"—"],sid:["SID",o.sid||"—"],
    arrrwy:["Arr RWY",o.dest_rwy||"—"],star:["STAR",o.star||"—"],destfob:["Plan FOB at dest",destFob]};
  const by={
    plan:["route","altn","ci","crz","block","trip","zfw","tow"],dark:["route","altn","deprwy"],
    prep:["ci","crz","zfw","block","tow","deprwy"],clr:["deprwy","sid","crz"],
    push:["block","deprwy"],taxi:["deprwy","sid","tow"],tkof:["deprwy","tow"],
    clb:["crz","steps"],crz:["crz","steps","star","arrrwy","trip"],des:["star","arrrwy","ldw"],
    appr:["arrrwy","ldw"],land:["arrrwy","destfob"],park:["destfob","fres","trip"]};
  return by[pid].map(k=>r[k]);
}
function phaseDone(pi){const[c,t]=phaseTotals(pi);return t>0&&c===t}

function drawProfile(){
  const n=D.length,x0=42,x1=898,svg=$("#profileSvg");
  const pts=D.map((p,i)=>[x0+(x1-x0)*i/(n-1),p.y]);
  let doneUpTo=-1;for(let i=0;i<n;i++){if(phaseDone(i))doneUpTo=i;else break;}
  let h=`<line class="pf-ground" x1="20" y1="${GY+9}" x2="920" y2="${GY+9}"/>`;
  h+=`<polyline class="pf-path" points="${pts.map(p=>p.join(",")).join(" ")}"/>`;
  if(doneUpTo>0)h+=`<polyline class="pf-path-done" points="${pts.slice(0,doneUpTo+1).map(p=>p.join(",")).join(" ")}"/>`;
  D.forEach((p,i)=>{
    const[cx,cy]=pts[i],done=phaseDone(i),act=i===state.cur;
    const above=cy<GY-4,ly=above?cy-16:cy+26;
    h+=`<g class="pf-node${done?" done":""}${act?" active":""}" data-i="${i}" tabindex="0" role="button" aria-label="${p.nav}">
      <circle cx="${cx}" cy="${cy}" r="7"/>
      <text x="${cx}" y="${ly}">${p.nav}</text></g>`;
  });
  svg.innerHTML=h;
  svg.querySelectorAll(".pf-node").forEach(g=>{
    const go=()=>{state.cur=+g.dataset.i;state.tab="flow";render();window.scrollTo({top:0})};
    g.addEventListener("click",go);
    g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go()}});
  });
}

function renderPhase(){
  const pi=state.cur,p=D[pi],[c,t]=phaseTotals(pi);
  let h=`<div class="phase-head"><span class="phase-num">PHASE ${String(pi).padStart(2,"0")} / ${String(D.length-1).padStart(2,"0")}</span>
    <span class="phase-title">${p.title}</span>
    <span class="phase-num" style="color:${c===t&&t?'var(--grn)':'var(--dim)'}">${c}/${t}</span></div>
  <p class="phase-goal">${p.goal}</p>`;
  if(p.batc&&p.batc.length){
    h+=`<div class="batc"><div class="batc-tag">📻 BEYONDATC — THIS PHASE</div><ul>${p.batc.map(b=>`<li>${b}</li>`).join("")}</ul></div>`;
  }
  const hasCl=!!p.cl;
  h+=`<div class="tabs">
    <button class="tab${state.tab==="flow"?" on":""}" data-tab="flow">FLOWS</button>
    <button class="tab${state.tab==="cl"?" on":""}" data-tab="cl" ${hasCl?"":"disabled"}>CHECKLIST</button></div><div class="pane">`;
  if(state.tab==="flow"){
    h+=(p.flows||[]).map(sec=>`<div class="flow-sec"><h3>${sec.h}</h3>${
      sec.s.map(st=>{const k=st.key,ck=state.checks.has(k);
        return `<label class="step${ck?" ck":""}" data-k="${k}"><input type="checkbox" data-k="${k}" ${ck?"checked":""}>
          <span class="txt">${st.t}${st.c?`<span class="chip">${st.c}</span>`:""}${st.n?`<span class="note">${st.n}</span>`:""}</span></label>`;
      }).join("")}</div>`).join("");
  }else if(p.cl){
    h+=`<div class="cl-title"><span>${p.cl.title}</span></div>`;
    if(p.cl.none)h+=`<p class="cl-none">${p.cl.none}</p>`;
    else h+=p.cl.items.map(it=>{
      if(it.line)return `<div class="cl-line"></div>`;
      const k=it.key,ck=state.checks.has(k);
      return `<div class="cl-item${ck?" ck":""}" data-k="${k}" role="checkbox" aria-checked="${ck}" tabindex="0">
        <span class="cl-ch">${it.ch}</span><span class="cl-dots"></span><span class="cl-rsp">${it.rsp}</span></div>`;
    }).join("");
  }
  h+=`</div>`;
  $("#phaseArt").innerHTML=h;
  $("#railBox").innerHTML=renderRail(p);
  const rb=$("#ofpRefresh");if(rb)rb.addEventListener("click",()=>send({type:"ofp_refresh"}));
  $("#phaseArt").querySelectorAll(".tab:not(:disabled)").forEach(b=>b.addEventListener("click",()=>{state.tab=b.dataset.tab;render()}));
  $("#phaseArt").querySelectorAll("input[data-k]").forEach(cb=>cb.addEventListener("change",()=>{toggle(cb.dataset.k)}));
  $("#phaseArt").querySelectorAll(".cl-item[data-k]").forEach(el=>{
    const t=()=>toggle(el.dataset.k);
    el.addEventListener("click",t);
    el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();t()}});
  });
  $("#prevBtn").disabled=pi===0;
  $("#nextBtn").disabled=pi===D.length-1;
}

function renderRail(p){
  const o=state.ofp;
  if(o){
    const when=new Date(o.generated_at).toISOString().slice(0,16).replace("T"," ")+"Z";
    const rows=ofpRows(p.id,o);
    const refresh=state.bridge.connected?`<button class="rail-refresh" id="ofpRefresh">↻ REFRESH OFP</button>`:"";
    return `<div class="rail"><div class="rail-tag">YOUR OFP</div><div class="rail-route">${esc(o.origin)} → ${esc(o.dest)}</div>
      <table>${rows.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join("")}</table>
      <div class="rl-note">SimBrief OFP · generated ${esc(when)}${o.airac?` · AIRAC ${esc(o.airac)}`:""}</div>${refresh}</div>`;
  }
  const rail=p.rail;
  return rail?`<div class="rail"><div class="rail-tag">EXAMPLE</div><div class="rail-route">KRDU → KATL</div>
    <table>${rail.rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join("")}</table>
    <div class="rl-note">${rail.note}</div></div>`:"";
}
function renderConn(){
  const el=$("#connPill"),b=state.bridge;
  el.hidden=!b.connected;
  if(!b.connected)return;
  const dot=(label,on)=>`<span class="${on?"on":""}">${label}</span>`;
  el.innerHTML=dot("BRIDGE",true)+dot("SIM",b.sources.sim)+dot("OFP",b.sources.ofp)+dot("MCDU",b.sources.mcdu);
}

function toggle(k){state.checks.has(k)?state.checks.delete(k):state.checks.add(k);render()}
function globalProg(){let c=0,t=0;D.forEach((_,i)=>{const[a,b]=phaseTotals(i);c+=a;t+=b});return t?Math.round(100*c/t):0}
function render(){drawProfile();renderPhase();renderConn();$("#progPct").textContent=globalProg()+"%";save()}

$("#prevBtn").addEventListener("click",()=>{if(state.cur>0){state.cur--;state.tab="flow";render();window.scrollTo({top:0})}});
$("#nextBtn").addEventListener("click",()=>{if(state.cur<D.length-1){state.cur++;state.tab="flow";render();window.scrollTo({top:0})}});
$("#resetBtn").addEventListener("click",()=>{
  if(state.checks.size&&!confirm("Reset all progress and start a new flight?"))return;
  state.checks.clear();state.cur=0;state.tab="flow";
  try{localStorage.removeItem(SKEY)}catch(e){}
  render();window.scrollTo({top:0});
});
/* Opened from file:// there is no bridge to talk to; the page runs standalone. */
let ws=null,retryMs=2000;
function send(msg){if(ws&&ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify(msg))}
function onBridgeMessage(m){
  if(m.type==="hello"){state.bridge.sources=m.sources}
  else if(m.type==="sources"){state.bridge.sources={sim:m.sim,mcdu:m.mcdu,ofp:m.ofp}}
  else if(m.type==="ofp"){state.ofp=m.data;state.bridge.sources.ofp=true}
  else return;
  render();
}
function connectBridge(){
  if(!location.protocol.startsWith("http"))return;
  ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host+"/ws");
  ws.addEventListener("open",()=>{retryMs=2000;state.bridge.connected=true;render()});
  ws.addEventListener("message",e=>{try{onBridgeMessage(JSON.parse(e.data))}catch(err){console.error("bad bridge message",err)}});
  ws.addEventListener("close",()=>{
    state.bridge.connected=false;render();
    setTimeout(connectBridge,retryMs);retryMs=Math.min(retryMs*2,30000);
  });
}
load();
render();
connectBridge();
</script>
</body>
</html>
